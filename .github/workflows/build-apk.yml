name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - name: Unpack project zip
        working-directory: ${{ github.workspace }}
        run: |
          set -e
          ZIP=$(ls -t *.zip | head -1)
          test -n "$ZIP"
          echo "Using: $ZIP"
          rm -rf app && mkdir app
          unzip -q "$ZIP" -d app
          if [ ! -f app/package.json ]; then
            D=$(dirname "$(find app -maxdepth 3 -name package.json -not -path '*/node_modules/*' | head -1)")
            test -d "$D"
            mv "$D" app_tmp && rm -rf app && mv app_tmp app
          fi
          test -f app/package.json
          ls app

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Accept Android licenses (SDK is preinstalled on the runner)
        working-directory: ${{ github.workspace }}
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check adhan audio files
        run: node scripts/prepare-android.mjs check

      - name: Build web app
        run: |
          npm run build
          if [ -s dist/index.html ]; then echo "web build OK"; else echo "web build missing"; ls; exit 1; fi

      - name: Add Android
        run: npx cap add android

      - name: Patch Android (permissions, sounds, notification icon, signing)
        run: node scripts/prepare-android.mjs patch

      - name: Launcher icons (non-blocking)
        continue-on-error: true
        run: |
          sudo apt-get install -y librsvg2-bin
          mkdir -p assets
          rsvg-convert -w 1024 -h 1024 public/icon.svg -o assets/icon-only.png
          npx capacitor-assets generate --android

      - name: Sync
        run: |
          npx cap sync android
          test -s android/app/src/main/assets/public/index.html

      - name: Set version
        run: |
          F=android/app/build.gradle
          sed -i "s/versionCode [0-9]\+/versionCode ${{ github.run_number }}/" $F
          sed -i "s/versionName \"[^\"]*\"/versionName \"1.0.${{ github.run_number }}\"/" $F

      - name: Build signed APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "${{ github.workspace }}/adhani.apk"

      - name: Publish APK in Releases (download directly from phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Adhani build ${{ github.run_number }}
          files: adhani.apk
          make_latest: true

      - uses: actions/upload-artifact@v4
        with:
          name: adhani-apk
          path: adhani.apk
          retention-days: 30
